<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Photograph placeholder — a student silhouetted at a workshop bench in front of a bright window">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfccc3" />
      <stop offset="1" stop-color="#a8a49a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fbf9f0" stop-opacity="0.85" />
